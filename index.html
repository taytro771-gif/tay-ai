<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAY AI</title>
    <style>
        body { margin:0; background:#131314; color:#e3e3e3; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: 0.5s; }
        .cyber-bg { background:#000 !important; color:#00ff41 !important; font-family:'Courier New', monospace !important; }
        #chat { height:80vh; overflow-y:auto; padding:20px; display:flex; flex-direction:column; }
        .msg { margin-bottom:20px; max-width:80%; padding:10px; line-height:1.6; }
        .user { align-self:flex-start; color:#fff; background:#2b2b2b; border-radius:15px; }
        .bot { align-self:flex-end; color:#e3e3e3; }
        .cyber-msg { border-left:2px solid #00ff41; padding-left:10px; color:#00ff41 !important; }
        .input-area { position:fixed; bottom:0; width:100%; padding:20px; background:#131314; box-sizing:border-box; }
        .cyber-input { background:#000 !important; border-top:1px solid #00ff41 !important; }
        input { width:80%; padding:15px; border-radius:30px; border:1px solid #444; background:#1e1f20; color:#fff; }
        button { padding:15px; border-radius:30px; border:none; background:#444; color:#fff; cursor:pointer; }
        .hacker-btn { background:#00ff41 !important; color:#000 !important; font-weight:bold; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div class="input-area" id="inputBox">
        <select id="mode" onchange="changeMode(this.value)" style="background:#1e1f20; color:#fff; padding:5px; border-radius:10px;">
            <option value="student">🎓 وضع الطالب</option>
            <option value="cyber">🛡️ وضع الأمن</option>
        </select>
        <input type="text" id="key" placeholder="كود 771" style="display:none; width:100px;">
        <input type="text" id="q" placeholder="بماذا يمكنني مساعدتك؟">
        <button id="sendBtn" onclick="send()">إرسال</button>
    </div>

<script>
    function changeMode(v){
        const isC = v === 'cyber';
        document.body.className = isC ? 'cyber-bg' : '';
        document.getElementById('inputBox').className = 'input-area' + (isC ? ' cyber-input' : '');
        document.getElementById('key').style.display = isC ? 'inline' : 'none';
        document.getElementById('sendBtn').className = isC ? 'hacker-btn' : '';
    }

    async function send(){
        const q=document.getElementById('q').value, m=document.getElementById('mode').value, k=document.getElementById('key').value;
        if(!q) return;
        const chat=document.getElementById('chat');
        chat.innerHTML += '<div class="msg user"> أنت: '+q+'</div>';
        document.getElementById('q').value='';

        try {
            const res = await fetch('/ask', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({q:q, key:k, level:m})
            });
            const data = await res.json();
            chat.innerHTML += '<div class="msg bot '+(m==='cyber'?'cyber-msg':'')+'"><b>تاي:</b> '+data.response+'</div>';
        } catch(e) {
            chat.innerHTML += '<div style="color:red">⚠️ فشل الاتصال. تأكد من إعدادات Vercel.</div>';
        }
        chat.scrollTop = chat.scrollHeight;
    }
</script>
</body>
</html>
