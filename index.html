<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAY SYSTEM 2026</title>
    <style>
        body { margin:0; background:#0b0f19; color:white; font-family:sans-serif; }
        #chat { height:75vh; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:8px; }
        .msg { padding:12px; border-radius:10px; max-width:85%; font-size:14px; line-height:1.5; }
        .user { background:#1e293b; align-self:flex-start; }
        .bot { background:#00d2ff22; border-right:4px solid #00d2ff; align-self:flex-end; white-space: pre-wrap; }
        .cyber .bot { background:#00ff4111; border-right:4px solid #00ff41; }
        .controls { padding:15px; background:#000; border-top:1px solid #333; position:fixed; bottom:0; width:100%; box-sizing:border-box; }
        input, select, button { width:100%; padding:10px; margin-bottom:5px; border-radius:5px; border:none; background:#1e293b; color:white; }
        button { background:#00d2ff; color:#000; font-weight:bold; cursor:pointer; }
        .cyber button { background:#00ff41; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div class="controls" id="ctrl">
        <select id="mode" onchange="document.body.className=(this.value==='cyber'?'cyber':''); document.getElementById('cyb').style.display=(this.value==='cyber'?'block':'none')">
            <option value="student">🎓 وضع الطالب</option>
            <option value="cyber">🛡️ وضع الخبير</option>
        </select>
        <div id="cyb" style="display:none;">
            <input type="password" id="key" placeholder="كود 771">
            <input type="file" id="pic" accept="image/*">
            <input type="file" id="doc" accept=".txt,.py,.js">
        </div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="q" placeholder="اسأل تاي..." style="flex:1;">
            <button onclick="send()">إرسال</button>
        </div>
    </div>
<script>
    async function send(){
        const q=document.getElementById('q').value, m=document.getElementById('mode').value, k=document.getElementById('key').value;
        const picFile=document.getElementById('pic').files[0], docFile=document.getElementById('doc').files[0];
        if(!q) return;
        addMsg(q,'user'); document.getElementById('q').value='';

        let img=null, txt=null;
        if(m==='cyber'){
            if(picFile){ 
                const reader = new FileReader(); reader.readAsDataURL(picFile);
                await new Promise(r=>reader.onload=r); 
                img = reader.result.split(',')[1];
                if(img.length > 2000000) return alert("الصورة كبيرة جداً، جرب صورة أصغر.");
            }
            if(docFile){ const reader = new FileReader(); reader.readAsText(docFile); await new Promise(r=>reader.onload=r); txt=reader.result; }
        }

        try {
            const res = await fetch('/ask', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({q:q, key:k, level:m, image:img, file_content:txt})
            });
            const data = await res.json();
            addMsg(data.response, 'bot');
        } catch(e) {
            addMsg("⚠️ خطأ في الاتصال. تأكد أن الملف ليس ضخماً.", 'bot');
        }
    }
    function addMsg(t,s){
        const d=document.createElement('div'); d.className='msg '+s; d.innerText=t;
        document.getElementById('chat').appendChild(d);
        document.getElementById('chat').scrollTop=99999;
    }
</script>
</body>
</html>
