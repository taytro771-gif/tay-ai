<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAY CORE v6.0 | Expert & Student</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main: #4facfe; --bg: #0f172a; --card: rgba(255,255,255,0.05); }
        body { margin:0; font-family:'Cairo'; background:var(--bg); color:white; transition: 0.5s; }
        
        /* وضع الهكر (Cyber Mode) - يتفعل برمجياً */
        body.cyber-mode { background: #050505; --main: #00ff41; }
        body.cyber-mode .card { border: 1px solid #00ff41; box-shadow: 0 0 15px rgba(0,255,65,0.2); }

        .container { display:flex; flex-direction:column; height:100vh; padding:15px; box-sizing:border-box; }
        header { text-align:center; padding:10px; border-bottom:1px solid var(--card); }
        #chat { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:10px; }
        .msg { padding:12px; border-radius:12px; max-width:85%; font-size:0.9rem; }
        .user { background: var(--card); align-self: flex-start; }
        .bot { background: linear-gradient(45deg, var(--main), transparent); align-self: flex-end; border-right:3px solid var(--main); }
        
        .input-box { background:rgba(0,0,0,0.5); padding:15px; border-radius:15px; display:flex; flex-direction:column; gap:10px; }
        input, select, button { padding:12px; border-radius:8px; border:none; outline:none; font-family:'Cairo'; }
        input, select { background:var(--card); color:white; }
        button { background:var(--main); color:black; font-weight:900; cursor:pointer; }
    </style>
</head>
<body>
<div class="container">
    <header> <h2 id="title">TAY SYSTEM v6.0</h2> </header>
    <div id="chat"></div>
    <div class="input-box">
        <div style="display:flex; gap:5px;">
            <input type="password" id="key" placeholder="مفتاح التفعيل (TAY-XXX)" style="flex:1;">
            <select id="level" onchange="changeMode(this.value)">
                <option value="student">🎓 وضع الطالب</option>
                <option value="cyber">🛡️ وضع الهكر</option>
            </select>
        </div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="query" placeholder="اسأل تاي..." style="flex:1;">
            <button onclick="ask()">إرسال</button>
        </div>
    </div>
</div>
<script>
    function changeMode(v) {
        document.body.className = (v === 'cyber') ? 'cyber-mode' : '';
        document.getElementById('title').innerText = (v === 'cyber') ? 'TAY CYBER EXPERT' : 'TAY STUDENT AI';
    }
    async function ask() {
        const q = document.getElementById('query').value;
        const k = document.getElementById('key').value;
        const l = document.getElementById('level').value;
        if(!q || !k) return alert('أدخل البيانات!');
        
        addMsg(q, 'user');
        const res = await fetch('/ask', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({q, key:k, level:l})
        });
        const data = await res.json();
        addMsg(data.response, 'bot');
    }
    function addMsg(t, s) {
        const d = document.createElement('div');
        d.className = 'msg ' + s;
        d.innerText = t;
        document.getElementById('chat').appendChild(d);
        document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }
</script>
</body>
</html>
