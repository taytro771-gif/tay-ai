<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAY SYSTEM FIX</title>
    <style>
        body { margin:0; background:#050505; color:#00ff41; font-family:monospace; }
        #chat { height:70vh; overflow-y:auto; padding:15px; border-bottom:1px solid #222; }
        .msg { margin:10px 0; padding:10px; border-radius:5px; border-left:3px solid #00ff41; background:rgba(0,255,65,0.05); white-space:pre-wrap; }
        .user { border-left-color:#00d2ff; color:#00d2ff; }
        .controls { padding:15px; display:flex; flex-direction:column; gap:5px; }
        input, select, button { background:#111; color:#00ff41; border:1px solid #333; padding:10px; border-radius:5px; }
        button { background:#00ff41; color:#000; font-weight:bold; cursor:pointer; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div class="controls">
        <select id="m" onchange="document.getElementById('c-box').style.display=(this.value==='c'?'flex':'none')">
            <option value="s">🎓 وضع الطالب</option>
            <option value="c">🛡️ وضع الخبير (771)</option>
        </select>
        <div id="c-box" style="display:none; flex-direction:column; gap:5px;">
            <input type="password" id="k" placeholder="كود 771">
            <input type="file" id="p" accept="image/*">
        </div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="q" placeholder="اسأل تاي..." style="flex:1;">
            <button onclick="send()">إرسال</button>
        </div>
    </div>
<script>
    async function send(){
        const q=document.getElementById('q').value, m=document.getElementById('m').value, k=document.getElementById('k').value;
        const p=document.getElementById('p').files[0];
        if(!q) return;
        addMsg(q,'user'); document.getElementById('q').value='';

        let img = null;
        if(m==='c' && p){
            const reader = new FileReader(); reader.readAsDataURL(p);
            await new Promise(r=>reader.onload=r);
            img = reader.result.split(',')[1];
        }

        try {
            const res = await fetch('/ask', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({q:q, key:k, level:(m==='c'?'cyber':'student'), image:img})
            });
            const data = await res.json();
            addMsg(data.response, 'bot');
        } catch(e) {
            addMsg("⚠️ فشل الاتصال. جرب إرسال نص فقط بدون صورة للتأكد.", 'bot');
        }
    }
    function addMsg(t,s){
        const d=document.createElement('div'); d.className='msg '+s; d.innerText=t;
        document.getElementById('chat').appendChild(d);
        document.getElementById('chat').scrollTop=99999;
    }
</script>
</body>
</html>
