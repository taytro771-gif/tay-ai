<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAY SYSTEM v13.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main: #00d2ff; --bg: #0f172a; }
        body { margin:0; font-family:'Cairo'; background:var(--bg); color:white; }
        body.cyber { --main: #00ff41; background: #050505; }
        .container { display:flex; flex-direction:column; height:100vh; padding:10px; box-sizing:border-box; }
        #chat { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:10px; }
        .msg { padding:12px; border-radius:15px; max-width:85%; font-size:0.9rem; line-height:1.6; }
        .user { background: rgba(255,255,255,0.1); align-self: flex-start; }
        .bot { background: linear-gradient(45deg, var(--main), transparent); align-self: flex-end; border-right:4px solid var(--main); white-space: pre-wrap; }
        .input-box { background:rgba(0,0,0,0.9); padding:10px; border-radius:15px; border:1px solid var(--main); display:flex; flex-direction:column; gap:8px; }
        input, select, button { padding:10px; border-radius:8px; border:none; font-family:'Cairo'; background:#1e293b; color:white; }
        button { background:var(--main); color:black; font-weight:900; cursor:pointer; }
        #cyber-tools { display: none; flex-direction: column; gap: 5px; }
        a { color: #fff; text-decoration: underline; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <header style="text-align:center;"><h2 id="st">🎓 TAY STUDENT</h2></header>
    <div id="chat"></div>
    <div class="input-box">
        <select id="mode" onchange="upd(this.value)">
            <option value="s">🎓 وضع الطالب</option>
            <option value="c">🛡️ وضع الأمن السيبراني</option>
        </select>
        <div id="cyber-tools">
            <input type="password" id="key" placeholder="أدخل كود الوصول الآمن...">
            <input type="file" id="pic" accept="image/*">
        </div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="q" placeholder="اكتب سؤالك هنا..." style="flex:1;">
            <button id="sendBtn" onclick="send()">إرسال</button>
        </div>
    </div>
</div>
<script>
    function saveKey(k) { try { localStorage.setItem("tay_key", k); } catch(e) {} }
    function getKey() { try { return localStorage.getItem("tay_key"); } catch(e) { return null; } }

    window.onload = () => {
        const saved = getKey();
        if(saved) {
            document.getElementById('key').value = saved;
            document.getElementById('key').placeholder = "✅ النظام نشط";
        }
    };

    function upd(v){
        const isC = (v==='c');
        document.body.className = isC ? 'cyber' : '';
        document.getElementById('st').innerText = isC ? '🛡️ TAY EXPERT' : '🎓 TAY STUDENT';
        document.getElementById('cyber-tools').style.display = isC ? 'flex' : 'none';
    }

    async function send(){
        const q = document.getElementById('q').value;
        const mode = document.getElementById('mode').value;
        const keyInput = document.getElementById('key').value;
        const key = keyInput || getKey();
        const file = document.getElementById('pic').files[0];
        
        if(!q) return;
        if(mode === 'c' && !key) {
            addMsg("⚠️ للتفعيل والحصول على الكود، تواصل مع المالك عبر التليجرام: @torto77", "bot");
            return;
        }

        addMsg(q, 'user');
        document.getElementById('q').value = '';

        let imgBase64 = null;
        if(mode === 'c' && file) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            await new Promise(r => reader.onload = r);
            imgBase64 = reader.result.split(',')[1];
        }

        try {
            const res = await fetch('/ask', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({q:q, key:key, level:(mode==='c'?'cyber':'student'), image:imgBase64})
            });
            const d = await res.json();
            
            if(d.status === "SUCCESS" && mode === 'c') {
                saveKey(key);
                document.getElementById('key').placeholder = "✅ النظام نشط";
            }
            
            // إذا رد السيرفر بأن المفتاح خاطئ
            if(d.response.includes("مفتاح غير صالح")) {
                addMsg("❌ الكود غير صحيح. للتواصل إتصل ب @torto77 في التليجرام.", "bot");
            } else {
                addMsg(d.response, 'bot');
            }
            
        } catch (e) {
            addMsg("⚠️ فشل الإرسال. للتواصل إتصل ب @torto77 في التليجرام.", "bot");
        }
    }

    function addMsg(t,s){
        const dv=document.createElement('div'); dv.className='msg '+s; 
        // تحويل المعرف لرابط قابل للنقر
        dv.innerHTML = t.replace('@torto77', '<a href="https://t.me/torto77" target="_blank">@torto77</a>');
        document.getElementById('chat').appendChild(dv);
        document.getElementById('chat').scrollTop = 99999;
    }
</script>
</body>
</html>
