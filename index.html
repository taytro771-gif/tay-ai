<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAY CYBER X</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --cyber: #00ff41; --bg: #050505; }
        body { margin:0; font-family:'Cairo'; background:#0f172a; color:white; transition: 0.3s; }
        body.cyber-mode { background: var(--bg); }
        .container { display:flex; flex-direction:column; height:100vh; padding:10px; box-sizing:border-box; }
        #chat { flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:12px; }
        .msg { padding:15px; border-radius:12px; max-width:85%; line-height:1.6; border: 1px solid rgba(255,255,255,0.1); }
        .bot { background: linear-gradient(45deg, #00d2ff, transparent); align-self: flex-end; border-right: 4px solid #00d2ff; }
        .cyber-msg { background: linear-gradient(45deg, var(--cyber), transparent) !important; border-right: 4px solid var(--cyber) !important; color: #fff; }
        .input-area { background:rgba(0,0,0,0.8); padding:15px; border-radius:20px; border:1px solid #444; }
        input, select, button { width:100%; padding:12px; margin-top:8px; border-radius:8px; border:none; background:#1e293b; color:white; font-family:'Cairo'; }
        button { background:#00d2ff; color:black; font-weight:bold; cursor:pointer; }
        .cyber-btn { background: var(--cyber) !important; }
    </style>
</head>
<body>
<div class="container">
    <h2 id="title" style="text-align:center;">🎓 TAY STUDENT</h2>
    <div id="chat"></div>
    <div class="input-area">
        <select id="mode" onchange="toggleMode(this.value)">
            <option value="student">🎓 وضع الطالب</option>
            <option value="cyber">🛡️ وضع الخبير السيبراني</option>
        </select>
        <div id="cyber-extras" style="display:none;">
            <input type="password" id="key" placeholder="أدخل كود التفعيل">
            <input type="file" id="pic" accept="image/*">
            <input type="file" id="doc" accept=".txt,.py,.js,.php,.html">
        </div>
        <input type="text" id="q" placeholder="اسأل تاي...">
        <button id="btn" onclick="process()">إرسال الطلب</button>
    </div>
</div>
<script>
    function toggleMode(v) {
        const isC = v === 'cyber';
        document.body.className = isC ? 'cyber-mode' : '';
        document.getElementById('cyber-extras').style.display = isC ? 'block' : 'none';
        document.getElementById('title').innerText = isC ? '🛡️ TAY CYBER EXPERT' : '🎓 TAY STUDENT';
        document.getElementById('btn').className = isC ? 'cyber-btn' : '';
    }

    async function process() {
        const q = document.getElementById('q').value;
        const mode = document.getElementById('mode').value;
        const key = document.getElementById('key').value;
        const pic = document.getElementById('pic').files[0];
        const doc = document.getElementById('doc').files[0];

        if(!q) return;
        addMsg(q, 'user');
        document.getElementById('q').value = '';

        let imgB64 = null, docText = null;
        if(mode === 'cyber') {
            if(pic) {
                const r = new FileReader(); r.readAsDataURL(pic);
                await new Promise(res => r.onload = res);
                imgB64 = r.result.split(',')[1];
            }
            if(doc) {
                const r = new FileReader(); r.readAsText(doc);
                await new Promise(res => r.onload = res);
                docText = r.result;
            }
        }

        try {
            const response = await fetch('/ask', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({q: q, key: key, level: mode, image: imgB64, file_content: docText})
            });
            const data = await response.json();
            addMsg(data.response, mode === 'cyber' ? 'bot cyber-msg' : 'bot');
        } catch (e) {
            addMsg("⚠️ فشل في الاتصال. للتفعيل تواصل مع @torto77", "bot");
        }
    }

    function addMsg(t, s) {
        const d = document.createElement('div'); d.className = 'msg ' + s;
        d.innerText = t;
        document.getElementById('chat').appendChild(d);
        document.getElementById('chat').scrollTop = 99999;
    }
</script>
</body>
</html>
