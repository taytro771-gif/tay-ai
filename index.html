<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAY CORE v17</title>
    <style>
        body { margin:0; background:#0f172a; color:white; font-family:sans-serif; transition: 0.5s; }
        body.cyber { background:#050505; color:#00ff41; }
        #chat { height:70vh; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
        .msg { padding:12px; border-radius:12px; max-width:85%; border:1px solid #333; line-height:1.5; font-size:14px; }
        .user { background: rgba(255,255,255,0.05); align-self: flex-start; }
        .bot { align-self:flex-end; background:rgba(0,210,255,0.1); border-right:4px solid #00d2ff; white-space: pre-wrap; }
        .cyber .bot { background:rgba(0,255,65,0.1); border-right:4px solid #00ff41; }
        .box { padding:15px; background:rgba(0,0,0,0.8); border-top:1px solid #333; position:sticky; bottom:0; }
        input, select, button { width:100%; padding:10px; margin-bottom:8px; border-radius:8px; border:none; background:#1e293b; color:white; }
        button { background:#00d2ff; color:black; font-weight:bold; cursor:pointer; }
        .cyber button { background:#00ff41; }
        #loading { display:none; text-align:center; color:orange; font-size:12px; margin-bottom:5px; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div id="loading">📡 جاري المعالجة والرفع...</div>
    <div class="box">
        <select id="mode" onchange="document.body.className=(this.value==='cyber'?'cyber':''); document.getElementById('extra').style.display=(this.value==='cyber'?'block':'none')">
            <option value="student">🎓 وضع الطالب</option>
            <option value="cyber">🛡️ وضع الخبير</option>
        </select>
        <div id="extra" style="display:none;">
            <input type="password" id="key" placeholder="كود الوصول">
            <input type="file" id="p" accept="image/*">
            <input type="file" id="d" accept=".py,.js,.txt,.html">
        </div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="q" placeholder="اكتب سؤالك..." style="flex:1;">
            <button onclick="send()" style="width:80px;">إرسال</button>
        </div>
    </div>
<script>
    // وظيفة لضغط الصور لضمان عدم فشل الاتصال
    async function compressImg(file) {
        return new Promise((res) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxW = 800;
                    const scale = maxW / img.width;
                    canvas.width = maxW;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    res(canvas.toDataURL('image/jpeg', 0.7).split(',')[1]);
                };
            };
        });
    }

    async function send(){
        const q=document.getElementById('q').value, m=document.getElementById('mode').value, k=document.getElementById('key').value;
        const p=document.getElementById('p').files[0], d=document.getElementById('d').files[0];
        if(!q) return;
        
        document.getElementById('loading').style.display = 'block';
        addMsg(q,'user'); document.getElementById('q').value='';
        
        let img=null, txt=null;
        if(m==='cyber'){
            if(p) img = await compressImg(p);
            if(d){ const r=new FileReader(); r.readAsText(d); await new Promise(x=>r.onload=x); txt=r.result; }
        }

        try {
            const res = await fetch('/ask', {
                method:'POST', 
                headers:{'Content-Type':'application/json'}, 
                body:JSON.stringify({q:q, key:k, level:m, image:img, file_content:txt})
            });
            const data = await res.json();
            addMsg(data.response, 'bot');
        } catch(e) { 
            addMsg("⚠️ فشل في الاتصال. تأكد من الكود أو جرب ملفاً آخر.", 'bot'); 
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    function addMsg(t,s){
        const div=document.createElement('div'); div.className='msg '+s; div.innerText=t;
        document.getElementById('chat').appendChild(div);
        document.getElementById('chat').scrollTop=99999;
    }
</script>
</body>
</html>
