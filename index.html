<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TAY HACKER INTERFACE v20</title>
    <style>
        :root { --bg: #0a0a0a; --text: #e8eaed; --accent: #8ab4f8; }
        body { margin:0; background:var(--bg); color:var(--text); font-family: 'Segoe UI', sans-serif; transition: 0.5s; }
        /* واجهة الهاكر - Matrix */
        body.hacker { background: #000 !important; color: #00ff41 !important; font-family: 'Courier New', monospace !important; }
        .container { display:flex; flex-direction:column; height:100vh; max-width:800px; margin:0 auto; border: 1px solid #333; }
        #chat { flex:1; overflow-y:auto; padding:20px; border-bottom:1px solid #333; }
        .msg { margin-bottom:20px; padding:10px; border-radius:8px; line-height:1.6; }
        .user { background: #202124; align-self: flex-start; border: 1px solid #3c4043; }
        .bot { align-self: flex-end; color: var(--accent); }
        .hacker .bot { color: #00ff41 !important; text-shadow: 0 0 5px #00ff41; }
        .input-box { padding:20px; display:flex; gap:10px; background:#171717; }
        input { flex:1; background:#303134; border:1px solid #5f6368; color:white; padding:12px; border-radius:24px; outline:none; }
        button { background:var(--accent); color:black; border:none; padding:10px 20px; border-radius:24px; cursor:pointer; font-weight:bold; }
        .hacker button { background:#00ff41 !important; color:black !important; box-shadow: 0 0 10px #00ff41; }
    </style>
</head>
<body>
    <div class="container">
        <div style="text-align:center; padding:10px; border-bottom:1px solid #333;">
            <select id="mode" onchange="applyMode(this.value)" style="background:#303134; color:white; border-radius:5px;">
                <option value="student">🎓 وضع Gemini (طالب)</option>
                <option value="cyber">💀 وضع الهـاكر (خبير)</option>
            </select>
        </div>
        <div id="chat"></div>
        <div class="input-box">
            <input type="password" id="key" placeholder="كود 771" style="display:none; width:80px;">
            <input type="text" id="q" placeholder="اكتب رسالتك لـ تاي...">
            <button onclick="send()">إرسال</button>
        </div>
    </div>
<script>
    function applyMode(v) {
        if(v === 'cyber') {
            document.body.className = 'hacker';
            document.getElementById('key').style.display = 'block';
        } else {
            document.body.className = '';
            document.getElementById('key').style.display = 'none';
        }
    }
    async function send() {
        const q=document.getElementById('q').value, m=document.getElementById('mode').value, k=document.getElementById('key').value;
        if(!q) return;
        const chat=document.getElementById('chat');
        chat.innerHTML += '<div class="msg user"><b>أنت:</b> '+q+'</div>';
        document.getElementById('q').value='';
        try {
            const res = await fetch('/ask', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({q:q, key:k, level:m})
            });
            const data = await res.json();
            chat.innerHTML += '<div class="msg bot"><b>تاي:</b> '+data.response+'</div>';
        } catch(e) {
            chat.innerHTML += '<div style="color:red">⚠️ حدث خطأ في النظام. تأكد من Vercel.</div>';
        }
        chat.scrollTop = chat.scrollHeight;
    }
</script>
</body>
</html>
